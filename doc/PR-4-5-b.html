<html>
    <head>
        <title>PR-4-5-b</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            
            .container{
                width: 700px;
                height: 700px;
                background-color: yellowgreen;
                animation: changeColor 2s ease infinite alternate;
            }
            
            .container, .wrapper{
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .wrapper{
                position: relative;
                width: 90%;
                height: 90%;
                background-color: #73DCCD;
            }
            
            @keyframes changeColor{
                to{
                    background-color: cornflowerblue;
                }
            }
            
            .suelo{
                position: absolute;
                bottom: 30px;
                width: 90%;
                height: 60%;
                border: 20px solid black;
                border-top: transparent;
            }
            
            .pelota{
                position: absolute;
                width: 80px;
                height: 80px;
                left: 0;
                bottom: 0;
                background-color: red;
                border-radius: 100%;
                animation: botar 1.5s linear infinite alternate;
            }
            
            @keyframes botar{
                0%{left: 0; top: 280px;}
                25%{left: 22%; top: 0px;}
                50%{left: 44%; top: 280px;}
                75%{left: 66%; top: 0px;}
                100%{left: 85%; top: 280px;}
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="wrapper">
                <div class="suelo">
                    <div class="pelota"></div>
                </div>
            </div>
        </div>
    </body>
</html>
