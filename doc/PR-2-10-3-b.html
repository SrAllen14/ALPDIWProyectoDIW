<html>
    <head>
        <title>PR-2-10-3-b</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
            }
            
            img{
                
            }
            
            .grid{
                width: 95%;
                height: 100%;
                margin: auto;
                border: 5px solid black;
                
            }
            
            header{
                height: 150px;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: 150px;
                place-items: center;
                justify-content: space-around;
                
                & div{
                    width: 70%;
                    height: 70%;
                    
                    & img{
                        max-width: 100%;
                        height: 100%;
                        display: block;
                        aspect-ratio: 1/1;
                    }
                }
            }
            
            main{
                width: 100%;
                height: 100%;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
                gap: 10px;
            }
            
            section{
                display: grid;
                grid-template-columns: 60% 20% 20%;
                
                & article{
                    width: 100%;
                    
                    & img{
                        width: 100%;
                    }
                }
                
                & article:nth-child(n+2){
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }
                & article:nth-child(2){
                    background-color: cyan;
                }
                
                & article:nth-child(3){
                    background-color: cadetblue;
                }
            }
        </style>
    </head>
    <body>
        <div class="grid">
        <header>
            <div><img src="http://picsum.photos/id/200/600/400" ></div>
            <div><img src="http://picsum.photos/id/201/600/400" ></div>
            <div><img src="http://picsum.photos/id/202/600/400" ></div>
        </header>
        <main>
            <section>
                <article><img src="http://picsum.photos/id/360/600/400"></article>
                <article>Imagen 1</article>
                <article>Lorem ipsum</article>
            </section>
           
             <section>
                <article><img src="http://picsum.photos/id/362/600/400"></article>
                <article>Imagen 2</article>
                <article>Lorem ipsum</article>
            </section>
             <section>
                <article><img src="http://picsum.photos/id/363/600/400"></article>
                <article>Imagen 3</article>
                <article>Lorem ipsum</article>
            </section>
             <section>
                <article><img src="http://picsum.photos/id/364/600/400"></article>
                <article>Imagen 4</article>
                <article>Lorem ipsum</article>
            </section>
             <section>
                <article><img src="http://picsum.photos/id/365/600/400"></article>
                <article>Imagen 5</article>

            </section>
             <section>
                <article><img src="http://picsum.photos/id/366/600/400"></article>

            </section>
 
        </main>
    </div>
    </body>
</html>
