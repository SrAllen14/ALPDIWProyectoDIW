        <style>
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            
            img{
                max-width: 100%;
                display: block;
            }
            
            .wrapper{
                width: 95dvw;
                height: 95dvh;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                place-items: center;
                
                & div{
                    width: 200px;
                    height: 200px;
                }
            }
            
            div:nth-child(1) img{
                border-radius: 34% 20% 22% 30% / 36% 26% 24% 31%;
            }
            
            div:nth-child(2) img{
                clip-path: ellipse(25% 40% at 50% 50%);
            }
            
            div:nth-child(3) img{
                
            }
        </style>
    </head>
