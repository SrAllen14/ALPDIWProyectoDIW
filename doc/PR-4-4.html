<html>
    <head>
        <title>PR-4-4</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            :root{
                --colorCara: blue;
                --colorReves: red;
            }
            
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: sans-serif;
            }
            
            .wrapper{
                width: 600px;
                height: 600px;
                background-color: #BBBBBB;
                margin: 100px auto;
                display: grid;
                place-items: center;
                perspective: 350px;
            }
            
            .carta{
                position: relative;
                width: 250px;
                height: 350px;
                transform-style: preserve-3d;
                transition: all 1s linear;
            }
            
            .cara, .reves{
                position: absolute;
                top: 0;
                width: 100%;
                height: 100%;
                font-size: 12rem;
                background-color: #DDDDDD;
                display: flex;
                justify-content: center;
                align-items: center;
                backface-visibility: hidden;
            }
            
            .cara{
                background-color: var(--colorCara);
                
            }
            
            .reves{
                background-color: var(--colorReves);
                transform: rotateY(180deg);
            }
            
            .carta:hover{
                animation: girar 2s ease;
            }
            
            @keyframes girar{
                to{
                    transform: rotateY(180deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="carta">
                <div class="cara">1</div>
                <div class="reves">2</div>
            </div>
        </div>
    </body>
</html>
