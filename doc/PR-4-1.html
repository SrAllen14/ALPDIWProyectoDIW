<html>
    <head>
        <title>PR-4-1</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: sans-serif;
            }
            
            .container{
                width: 90vw;
                height: 90vh;
            }
            
            .box{
                position: relative;
                width: 400px;
                height: 300px;
                margin: 50px auto;
                background-image: url(http://picsum.photos/id/250/400/300);
                border: 4px solid red;
                & *{transition: left 1s ease-in;}
                
                & h1{
                    position: absolute;
                    left: 120%;
                    top: 35%;
                }
                
                & p{
                    position: absolute;
                    left: 120%;
                    top: 55%;
                }
            }
            
            .capa{
                position: absolute;
                top: 0;
                left: 100%;
                width: 392px;
                height: 292px;
                background-color: rgba(255, 0, 0, 0.456);
            }
            
            .box:hover .capa{
                left: 0;
            }
            
            .box:hover h1{
                left: 40%;
            }
            
            .box:hover p{
                left:30%;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box">
                <div class="capa"></div>
                <h1>Titulo</h1>
                <p>Esto es una prueba</p>
            </div>
        </div>
    </body>
</html>
