<html>
    <head>
        <title>PR-4-1-B</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-size: 1.1rem;
            }
            
            .container{
                width: 90vw;
                height: 90vh;
                margin: auto;
                background-color: #BBBBBB;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            article{
                position: relative;
                width: 300px;
                height: 450px;
                background-color: #5FA062;
                display: flex;
                flex-flow: column;
                justify-content: center;
                align-items: center;
                gap: 5px;
                box-shadow: 5px 5px 5px #641F24;
                overflow: hidden;
                transition: all 1s ease-in;
                transition: width 1s 0s, height 1s 2s, border-radius 1s 3s, background-color 1s 4s, border 1s 5s, padding 1s 6s, box-shadow 1s 7s;
                
                & h2{
                    margin-bottom: 10px;
                    color: #E88C00;
                }
                
                & p{
                    transition: left 0.5s ease-in-out;
                    position: relative;
                    left: 120%;
                }
            }
            
            article:hover{
                width: 350px;
                height: 450px;
                border-radius: 50%;
                background-color: purple;
                border: 3px solid #A77041;
                padding: 10px;
                box-shadow: 0 0 7px 10px #641F24;
                
                & p{
                    left: 0;
                }
            }
            
            article p:nth-child(2){transition-delay: 1s;}
            article p:nth-child(3){transition-delay: 2s;}
            article p:nth-child(4){transition-delay: 3s;}
            article p:nth-child(5){transition-delay: 4s;}
            article p:nth-child(6){transition-delay: 5s;}
            article p:nth-child(7){transition-delay: 6s;}
            article p:nth-child(8){transition-delay: 7s;}
        </style>
    </head>
    <body>
        <div class="container">
            <article>
                <h2>Voy cambiando</h2>
                <p>Tamaño ancho</p>
                <p>Tamaño largo</p>
                <p>Border radius</p>
                <p>Color de fondo</p>
                <p>Borde</p>
                <p>Padding</p>
                <p>Sombra</p>
            </article>
        </div>
    </body>
</html>
