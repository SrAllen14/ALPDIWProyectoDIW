<html>
    <head>
        <title>PR-2-10-5</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            
            .wrapper{
                width: 95%;
                height: 50dvh;
                padding: 10px;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 10px;
            }
            
            .card{
                display: grid;
                grid-template-columns: subgrid;
                grid-template-rows: subgrid;
                grid-row: span 3;
                border-radius: 6px;
                font-size: 2rem;
                padding: 15px;
                
                & h2{
                    border-bottom: 1px solid black;
                }
                
                & div{
                    width: 100%;
                    height: 150px;
                    
                }
            }
            
            .card1{
                background-color: lawngreen;
            }
            
            .card2{
                background-color: peru;
            }
            
            .card3{
                background-color: cyan;
            }
            
            .card4{
                background-color: pink;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="card card1">
                <h2>Título 1</h2>
                <article>Lorem ipsum carpe diem</article>
                <div></div>
            </div>
            <div class="card card2">
                <h2>Titulo 2</h2>
                <article>Lorem ipsum carpe diem</article>
                <div></div>
            </div>
            <div class="card card3">
                <h2>Titulo 3</h2>
                <article>Lorem ipsum carpe diem</article>
                <div></div>
            </div>
            <div class="card card4">
                <h2>Titulo 4</h2>
                <article>Lorem ipsum carpe diem</article>
                <div></div>
            </div>
        </div>
    </body>
</html>
