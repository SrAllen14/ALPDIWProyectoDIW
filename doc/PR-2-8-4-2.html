<html>
    <head>
        <title>PR-2-8-4-2</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
            }
            
            .container{
                position: relative;
                height: 600px;
                width: 600px;
                padding-left: 50px;
            }
            
            .ball{
                position: absolute;
                z-index: auto;
                top: 50%;
                left: 50%;
                height: 50%;
                transform: -50%, -50%;
                width: 300px;
                height: 300px;
                z-index: 1;
                border-radius: 50%;
                background: transparent;
            }
            
            .ball2{
                position: absolute;
                top: 0;
                left: 0;
                width: 300px;
                height: 300px;
                border-radius: 50%;
                background-image: radial-gradient(circle at 0% 0%, rgba(255, 255, 0, 1) 25%, rgba(0, 0, 255, 1) 75%);
            }
            
            .ball::after{
                content: "";
                position: absolute;
                width: 50%;
                height: 5px;
                box-shadow: 5px -5px 10px 8px blue;
                bottom: 0;
                left: 50%;
                border-radius: 50%;
                background: blue;
                z-index: -1;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="ball">
                <div class="ball2"></div>
            </div>
        </div>
    </body>
</html>
