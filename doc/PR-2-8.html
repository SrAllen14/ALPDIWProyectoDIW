<html>
    <head>
        <title>PR-2-8</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
            }
            
            .container, nav{
                position: relative;
            }
            
            nav a{
                display: inline-block;
                width: 96px;
                height: 48px;
                text-decoration: none;
                margin-right: 12px;
                text-align: center;
                line-height: 48px;
                border-radius: 10px 10px 0px 0px;
                color: black;
            }
            
            nav a:nth-of-type(1){background-color: #67e767;}
            nav a:nth-of-type(2){background-color: #5178e4;}
            nav a:nth-of-type(3){background-color: #ebb7d9;}
            
            main{
                position: relative;
            }
            
            main article{
                position: absolute;
                width: 500px;
                height: 400px;
                padding-top: 10px;
            }
            
            main article:nth-of-type(1){
                background-color: #67e767;
                z-index: 1;
            }
            
            main article:nth-of-type(2){background-color: #5178e4;}
            main article:nth-of-type(3){background-color: #ebb7d9;}
            main article:target{
                z-index: 5;
            }
            
        </style>
    </head>
    <body>
        <div class="container">
            <nav>
                <a href="#1">Primera</a>
                <a href="#2">Segunda</a>
                <a href="#3">Tercera</a>
            </nav>
            <main>
                <article id="1">Este es el contenido del artículo 1</article>
                <article id="2">Este es el contenido del artículo 2</article>
                <article id="3">Este es el contenido del artículo 3</article>
            </main>
        </div>
    </body>
</html>
