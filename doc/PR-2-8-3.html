<html>
    <head>
        <title>PR-2-8-3</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            
            .container{
                position: relative;
                width: 98vw;
                height: 98vh;
                background-color: #3C456A;
                border: 0.1px transparent;
            }
            
            nav{
                position: relative;
                width: 100%;
                height: 70px;
                background-color: #4B7373;
                margin: 5px;
                border: 1px solid white;
            }
            
            nav label{
                display: block;
                width: 56px;
                height: 56px;
                background-color: #787878;
                position: relative;
                top: 7px;
                left: 7px;
                border-radius: 5px;
                
                & span{
                    display: block;
                    position: relative;
                    left: 3px;
                    width: 50px;
                    height: 4px;
                    background-color: white;
                }
                
                & span:nth-child(1){
                    top: 11px;
                }
                & span:nth-child(2){
                    top: 26px;
                }
                & span:nth-child(3){
                    top: 41px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <nav>
                <label for="btnOpen" id="lblOpen">
                    <span><span><span></span></span></span>
                </label>
                
            </nav>
            <input type="radio" name="btns" id="btnOpen">
            
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Alumnos</a></li>                
                <li><a href="#">Secretaria</a></li>
                <li><a href="#">Profesorado</a></li>

            </ul>
        </div>
    </body>
</html>
