<html>
    <head>
        <title>PR-2-7-B</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
            }
            
            .container{
                position: relative;
                width: 600px;
                height: 500px;
                background-color: gray;
            }
            
            .box, p{
                position: absolute;
                width: 375px;
                height: 270px;
            }
            
            .box5{
                top: 0;
                left: 0;
                z-index: 0;
                background-color: #8cd796;
            }
            
            .box1{
                right: 0px;
                background-color: #be4673;
                z-index: 3;
            }
            
            .box2{
                top: 110px;
                left: 112px;
                z-index: 2;
                background-color: #e6cd5f;
            }
            
            p{
                background-color: blue;
                width: 200px;
                z-index: 100;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box box1">1</div>
            <div class="box box2">
                <p>Parrafo 2</p>
            </div>
            <div class="box box3"></div>
            <div class="box box4"></div>
            <div class="box box5">5</div>
        </div>
    </body>
</html>
