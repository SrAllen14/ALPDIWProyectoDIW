<html>
    <head>
        <title>PR-2-10-4-a</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
            }
            
            .flex, .grid{
                & div:nth-child(odd){
                    background-color: #A5D2D2;
                }
                
                & div:nth-child(even){
                    background-color: #96B98C;
                }
            }
            
            .flex{
                width: 400px;
                height: 300px;
                display: flex;
                flex-flow: column wrap;
                margin-bottom: 20px;
                
                & div{
                    flex: 0 0 60px;
                    width: 100px;
                }
                
                & div:nth-child(n+11){
                    width: 200px;
                }
            }
            
            .grid{
                display: grid;
                grid-template-columns: 100px 100px 200px;
                grid-template-rows: repeat(5, 60px);
                grid-auto-flow: column;
                
                & div{
                    text-align: center;
                    align-content: center;
                }
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <h1>COLOCACIÓN CON FLEX</h1>
            <div class="flex">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>7</div>
                <div>8</div>
                <div>9</div>
                <div>10</div>
                <div>11</div>
                <div>12</div>
            </div>
            <h1>COLOCACIÓN CON GRID</h1>
            <div class="grid">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>7</div>
                <div>8</div>
                <div>9</div>
                <div>10</div>
                <div>11</div>
                <div>12</div>
            </div>
        </div>
    </body>
</html>
