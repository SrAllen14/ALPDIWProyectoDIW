<html>
    <head>
        <title>PR-3-4-2</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
            }
            
            .container{
                width: 95dvw;
                height: 100dvh;
            }
            
            .button{
                background-color: #a77882;
                width: max-content;
                height: max-content;
                margin-top: 100px;
                padding: 50px;
                margin: auto;
                border-radius: 6px;
                
                & span{
                    font-family: Impaxt, Haettenshweiler, 'Arial Harrow Bold', sans-serif;
                    font-size: 5rem;
                    font-weight: 900;
                    letter-spacing: 0.5rem;
                    background: url(http://picsum.photos/id/400/200/200);
                    background-clip: text;
                    color: transparent;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="button"><span>Fondo Texto</span></div>
        </div>
    </body>
