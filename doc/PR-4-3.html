<html>
    <head>
        <title>PR-4-3</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                --color: red;
                --color2: yellow;
            }
            
            .container{
                display: flex;
                width: 300px;
                height: 300px;
                background-color: #AAAAAA;
                margin: 200px auto;
                justify-content: center;
                align-items: center;
            }
            
            .helice{
                position: relative;
                width: 50px;
                height: 50px;
                background-color: red;
                border-radius: 10px;
                box-shadow: 0 80px var(--color2),
                            0 -80px var(--color2),
                            80px 0 var(--color),
                            -80px 0 var(--color);
                transition: all 1s ease;
                
                &:hover{
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="helice">
                
            </div>
        </div>
    </body>
</html>
