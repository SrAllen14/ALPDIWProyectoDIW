<html>
    <head>
        <title>PR-2-7-B</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
            }
            
            .container{
                position: relative;
                width: 600px;
                height: 500px;
                background-color: gray;
            }
            
            .box{
                position: absolute;
                width: 375px;
                height: 270px;
                font-size: 1.3rem;
                
                p{
                    margin: 10px;
                    font-weight: bold;
                }
            }
            
            .box5{
                top: 0;
                left: 0;
                z-index: 1;
                background-color: #8cd796;
            }
            
            .box1{
                right: 0;
                top: 0;
                background-color: #be4673;
                z-index: 2;
            }
            
            .box2{
                top: 110px;
                left: 112px;
                z-index: 3;
                background-color: #e6cd5f;
            }
            
            .box3{
                bottom: 0;
                right: 0;
                z-index: 1;
                background-color: #6487AF;
                
                p{
                    position: relative;
                    bottom: 0;
                    right: 0;
                }
            }
            
            .box4{
                bottom: 0;
                left: 0;
                z-index: 2;
                background-color: #825AD7;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box box1">
                <p>1</p>
            </div>
            <div class="box box2">
                <p>2</p>
            </div>
            <div class="box box3">
                <p>3</p>
            </div>
            <div class="box box4">
                <p>4</p>
            </div>
            <div class="box box5">
                <p>5</p>
            </div>
        </div>
    </body>
</html>
